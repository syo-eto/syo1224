<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大工日報</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#222;--sub:#666;--line:#d9dbd4;--acc:#2f6b4f;--acc2:#e7f0ea;--warn:#b3261e;--warnbg:#fbebeb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
header{background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .who{margin-left:auto;font-size:14px}
header .who button{margin-left:6px;font-size:13px;padding:3px 8px;border-radius:6px;border:1px solid #fff;background:none;color:#fff}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--sub)}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;cursor:pointer}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.big{width:100%;padding:14px;font-size:17px;margin-top:6px}
.btn.del{color:var(--warn);font-size:13px;padding:4px 10px;margin-left:auto}
.btn:disabled{opacity:.5}
.note{font-size:13px;color:var(--sub);margin:6px 0}
.msg{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:var(--acc2)}
.msg.err{background:var(--warnbg);color:var(--warn)}
.msg:empty{display:none}
.kind{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acc2);color:var(--acc)}
.unit{flex:0 0 auto;align-self:center;color:var(--sub)}
.qty{display:flex;gap:8px}
.total{font-size:15px;margin:4px 0 0}
.total b{font-size:20px;color:var(--acc)}
.receipt div{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.receipt div:first-child{border-top:0}
.hidden{display:none}
.loading{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>大工日報</h1>
  <span class="who hidden" id="whoBox"><b id="whoName"></b><button id="whoChange" type="button">切替</button></span>
</header>
<main>
  <div class="msg" id="msg"></div>
  <div class="loading" id="loading">読み込み中…</div>

  <section id="pickView" class="hidden">
    <div class="card">
      <h2>入力するのは誰ですか？</h2>
      <label class="f" for="pickWorker">名前</label>
      <select id="pickWorker"></select>
      <div id="pinBox" class="hidden">
        <label class="f" for="pickPin">暗証番号</label>
        <input id="pickPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      </div>
      <button class="btn pri big" id="pickOk" type="button">決定</button>
      <p class="note">次からはこの端末で自動で選ばれます。</p>
    </div>
  </section>

  <section id="formView" class="hidden">
    <div class="card">
      <label class="f" for="date" style="margin-top:0">日付</label>
      <input id="date" type="date">
      <p class="note" id="dateNote"></p>
    </div>
    <div id="lines"></div>
    <button class="btn big" id="addLine" type="button">＋ 作業を追加</button>
    <div class="card" style="margin-top:14px">
      <p class="total">合計 <b id="totalHours">0</b> 時間</p>
      <button class="btn pri big" id="send" type="button">送信</button>
      <p class="note">送るまでの入力は、この端末に自動で残ります（電波が無いときも消えません）。送信した日のうちなら、直して送り直せます。</p>
    </div>
  </section>

  <section id="doneView" class="hidden">
    <div class="card">
      <h2>受け付けました</h2>
      <p class="note" id="doneHead"></p>
      <div class="receipt" id="receipt"></div>
      <button class="btn pri big" id="again" type="button">入力画面にもどる</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var WHO_KEY = 'daiku_nippo_who';
  var DRAFT_PREFIX = 'daiku_nippo_draft_';
  var MAX_HOURS = 12;
  var MAT_OTHER = '__other__', MAT_NONE = '__none__';

  var master = null;
  var who = null;          // {workerId, pin}
  var state = null;        // {date, lines:[], materials:[]}
  var locked = false;      // 直せない日報
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function flash(t, err) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); if (t) window.scrollTo(0, 0); }
  function show(id) { ['loading', 'pickView', 'formView', 'doneView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); }); }

  function call(fn, args, ok, ng) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var t = (e && e.message) ? e.message : String(e);
      if (ng) ng(t); else flash(t, true);
    });
    r[fn].apply(r, args || []);
  }

  function siteById(id) { return master.sites.filter(function (s) { return s.id === id; })[0]; }
  function workById(id) { return master.works.filter(function (w) { return w.id === id; })[0]; }
  function workerById(id) { return master.workers.filter(function (w) { return w.id === id; })[0]; }
  function draftKey() { return DRAFT_PREFIX + who.workerId + '_' + state.date; }
  function saveDraft() { if (who && state && !locked) store(draftKey(), { lines: state.lines }); }
  function emptyLine(prev) { return { siteId: prev ? prev.siteId : (master.sites.length === 1 ? master.sites[0].id : ''), workId: '', hours: '', materialId: '', materialText: '', qty: '' }; }

  /* ── 入力者 ── */
  function startPick() {
    var sel = $('pickWorker');
    sel.innerHTML = '<option value="">選んでください</option>' + master.workers.map(function (w) {
      return '<option value="' + esc(w.id) + '">' + esc(w.name) + '</option>';
    }).join('');
    sel.onchange = function () { var w = workerById(sel.value); $('pinBox').classList.toggle('hidden', !(w && w.hasPin)); };
    $('pickPin').value = '';
    $('pinBox').classList.add('hidden');
    $('whoBox').classList.add('hidden');
    show('pickView');
  }
  $('pickOk').onclick = function () {
    var id = $('pickWorker').value;
    if (!id) { flash('名前を選んでください。', true); return; }
    var w = workerById(id);
    var pin = w.hasPin ? $('pickPin').value.trim() : '';
    if (w.hasPin && !pin) { flash('暗証番号を入れてください。', true); return; }
    $('pickOk').disabled = true;
    call('loadReport', [id, pin, master.today], function () {
      $('pickOk').disabled = false;
      who = { workerId: id, pin: pin };
      store(WHO_KEY, who);
      flash('');
      startForm(master.today);
    }, function (t) { $('pickOk').disabled = false; flash(t, true); });
  };
  $('whoChange').onclick = function () { store(WHO_KEY, null); who = null; flash(''); startPick(); };

  /* ── 日報の入力 ── */
  function startForm(date) {
    var w = workerById(who.workerId);
    $('whoName').textContent = w ? w.name : '';
    $('whoBox').classList.remove('hidden');
    $('date').max = master.today;
    $('date').value = date;
    openDate(date);
    show('formView');
  }

  function openDate(date) {
    state = { date: date, lines: [] };
    locked = false;
    $('dateNote').textContent = '';
    var draft = load(DRAFT_PREFIX + who.workerId + '_' + date);
    if (draft && draft.lines && draft.lines.length) {
      state.lines = draft.lines;
      $('dateNote').textContent = '送る前の入力を戻しました。';
      render();
      return;
    }
    state.lines = [emptyLine()];
    render();
    call('loadReport', [who.workerId, who.pin, date], function (r) {
      if (!r || !r.exists || state.date !== date) return;
      state.lines = r.lines.length ? r.lines : [emptyLine()];
      locked = !r.editable;
      $('dateNote').textContent = locked ? 'この日の日報は送信済みです（直すときは管理者に連絡してください）。' : '送信済みの日報です。直して送り直せます。';
      render();
    });
  }
  $('date').onchange = function () {
    var d = $('date').value;
    if (!d) return;
    if (d > master.today) { flash('先の日付は選べません。', true); $('date').value = state.date; return; }
    flash('');
    openDate(d);
  };

  function optionList(items, value, placeholder) {
    return '<option value="">' + esc(placeholder || '選んでください') + '</option>' + items.map(function (it) {
      var v = typeof it === 'string' ? it : it.value, t = typeof it === 'string' ? it : it.label;
      return '<option value="' + esc(v) + '"' + (String(value) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
  }

  function render() {
    var html = state.lines.map(function (l, i) {
      var site = siteById(l.siteId), work = workById(l.workId);
      var works = site ? master.works.filter(function (w) { return w.kind === site.kind; }) : [];
      var h = '<div class="card" data-i="' + i + '"><h2>作業 ' + (i + 1) + (site ? ' <span class="kind">' + esc(site.kind) + '</span>' : '') +
        (state.lines.length > 1 && !locked ? '<button class="btn del" type="button" data-act="del">削除</button>' : '') + '</h2>';
      h += '<label class="f">現場</label><select data-f="siteId">' + optionList(master.sites.map(function (s) { return { value: s.id, label: s.name }; }), l.siteId) + '</select>';
      h += '<label class="f">作業内容</label><select data-f="workId"' + (site ? '' : ' disabled') + '>' +
        optionList(works.map(function (w) { return { value: w.id, label: w.name }; }), l.workId, site ? '選んでください' : '先に現場を選んでください') + '</select>';
      if (work) {
        var hours = []; for (var k = 1; k <= MAX_HOURS; k++) hours.push({ value: String(k), label: k + ' 時間' });
        h += '<label class="f">時間</label><select data-f="hours">' + optionList(hours, l.hours) + '</select>';
        if (work.unit && work.unit !== '―') {
          var mats = master.materials.filter(function (m) { return !m.works.length || m.works.indexOf(work.name) >= 0; })
            .map(function (m) { return { value: m.id, label: m.name }; })
            .concat([{ value: MAT_OTHER, label: 'その他（書く）' }, { value: MAT_NONE, label: 'なし' }]);
          h += '<label class="f">材料</label><select data-f="materialId">' + optionList(mats, l.materialId) + '</select>';
          if (l.materialId === MAT_OTHER) h += '<input data-f="materialText" placeholder="材料の名前（例：無垢オーク15mm）" value="' + esc(l.materialText) + '" style="margin-top:6px">';
          h += '<label class="f">数量</label><div class="qty"><input data-f="qty" type="number" inputmode="decimal" min="0" step="any" value="' + esc(l.qty) + '"><span class="unit">' + esc(work.unit) + '</span></div>';
        }
      }
      return h + '</div>';
    }).join('');
    $('lines').innerHTML = html;
    $('totalHours').textContent = state.lines.reduce(function (a, l) { return a + (Number(l.hours) || 0); }, 0);
    if (locked) {
      Array.prototype.forEach.call(document.querySelectorAll('#lines input, #lines select, #lines button'), function (el) { el.disabled = true; });
    }
    ['addLine', 'send'].forEach(function (id) { $(id).disabled = locked; });
    $('send').textContent = locked ? '送信済み' : '送信';
  }

  $('lines').addEventListener('change', function (e) { onLineInput(e, true); });
  $('lines').addEventListener('input', function (e) { if (e.target.tagName === 'INPUT') onLineInput(e, false); });
  $('lines').addEventListener('click', function (e) {
    if (e.target.getAttribute('data-act') !== 'del') return;
    var i = Number(e.target.closest('[data-i]').getAttribute('data-i'));
    state.lines.splice(i, 1); saveDraft(); render();
  });
  function onLineInput(e, rerender) {
    var el = e.target, card = el.closest('[data-i]');
    if (!card) return;
    var l = state.lines[Number(card.getAttribute('data-i'))];
    var f = el.getAttribute('data-f');
    if (f === 'siteId') {
      var oldKind = (siteById(l.siteId) || {}).kind;
      l.siteId = el.value;
      if ((siteById(l.siteId) || {}).kind !== oldKind) { l.workId = ''; l.materialId = ''; l.materialText = ''; l.qty = ''; }
    } else if (f === 'workId') { l.workId = el.value; l.materialId = ''; l.materialText = ''; l.qty = ''; }
    else if (f === 'hours') l.hours = el.value;
    else if (f === 'qty') l.qty = el.value;
    else if (f === 'materialId') l.materialId = el.value;
    else if (f === 'materialText') l.materialText = el.value;
    saveDraft();
    if (rerender && (f === 'siteId' || f === 'workId' || f === 'hours' || f === 'materialId')) render();
  }
  $('addLine').onclick = function () { state.lines.push(emptyLine(state.lines[state.lines.length - 1])); saveDraft(); render(); };

  /* ── 送信 ── */
  function checkBeforeSend() {
    for (var i = 0; i < state.lines.length; i++) {
      var l = state.lines[i], n = '作業' + (i + 1) + '：', w = workById(l.workId);
      if (!l.siteId) return n + '現場を選んでください。';
      if (!w) return n + '作業内容を選んでください。';
      if (!l.hours) return n + '時間を選んでください。';
      if (w.unit && w.unit !== '―') {
        if (!l.materialId) return n + '材料を選んでください（使っていなければ「なし」）。';
        if (l.materialId === MAT_OTHER && !String(l.materialText || '').trim()) return n + '材料の名前を書いてください。';
      }
      if (w.unit && w.unit !== '―' && (l.qty === '' || l.qty === null || isNaN(Number(l.qty)))) return n + '数量（' + w.unit + '）を入れてください。';
    }
    return '';
  }
  $('send').onclick = function () {
    if (locked) return;
    var err = checkBeforeSend();
    if (err) { flash(err, true); return; }
    var total = state.lines.reduce(function (a, l) { return a + Number(l.hours); }, 0);
    if (!window.confirm(state.date + ' の日報を送ります（' + state.lines.length + '件、合計 ' + total + ' 時間）。')) return;
    $('send').disabled = true; $('send').textContent = '送信中…';
    var payload = {
      workerId: who.workerId, pin: who.pin, date: state.date,
      lines: state.lines.map(function (l) { return { siteId: l.siteId, workId: l.workId, hours: Number(l.hours), materialId: l.materialId || '', materialText: l.materialText || '', qty: l.qty === '' ? '' : Number(l.qty) }; })
    };
    call('submitReport', [payload], function (r) {
      store(draftKey(), null);
      flash('');
      $('doneHead').textContent = r.date + '（' + (r.updated ? '直して送り直し' : '送信') + '）合計 ' + r.totalHours + ' 時間';
      $('receipt').innerHTML = r.lines.map(function (l) {
        return '<div><b>' + esc(l.work) + '</b> ' + l.hours + '時間' + (l.qty !== '' ? '・' + esc(l.qty) + esc(l.unit) : '') +
          '<br><span class="note">' + esc(l.site) + (l.material ? '　材料：' + esc(l.material) : '') + '</span></div>';
      }).join('');
      show('doneView');
    }, function (t) { $('send').disabled = false; $('send').textContent = '送信'; flash('送れませんでした：' + t + '（入力はこの端末に残っています）', true); });
  };
  $('again').onclick = function () { startForm(state.date); };

  /* ── 起動 ── */
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    show('');
    flash('このページは単体では動きません。Apps Script の「デプロイ → ウェブアプリ」で出た URL（…/exec）から開いてください。', true);
    return;
  }
  var slow = setTimeout(function () {
    if (master) return;
    show('');
    flash('読み込みに時間がかかっています。電波の良い所で開き直してください。直らないときは、管理者が Apps Script の「実行数」でエラーを確かめてください。', true);
  }, 30000);
  call('getMaster', [], function (m) {
    clearTimeout(slow);
    master = m;
    if (!m.workers.length || !m.sites.length || !m.works.length) {
      show('');
      flash('まだ使える状態ではありません（作業員・進行中の現場・作業内容を管理者が登録してください）。', true);
      return;
    }
    who = load(WHO_KEY);
    if (!who || !workerById(who.workerId)) startPick(); else startForm(m.today);
  }, function (t) { clearTimeout(slow); show(''); flash('読み込めませんでした：' + t, true); });
})();
</script>
</body>
</html>
